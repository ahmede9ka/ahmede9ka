<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Ahmed Kallel — Software Engineer, AI and Automation, Full-Stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a141d"/>
      <stop offset="0.6" stop-color="#0f2330"/>
      <stop offset="1" stop-color="#14394a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#F4C95D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .mono{font-family:'Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
    .r1{animation:rise .8s .1s both}
    .r2{animation:rise .8s .3s both}
    .r3{animation:rise .8s .5s both}
    .r4{animation:rise .8s .7s both}
    .r5{animation:rise .8s .9s both}
    .bar{transform-box:fill-box;transform-origin:left center;animation:grow .9s .6s both}
    .edge{stroke:#38BDF8;stroke-opacity:.55;stroke-width:1.4;stroke-dasharray:4 8;animation:flow 1.2s linear infinite}
    .node{animation:pulse 2.8s ease-in-out infinite}
    .n2{animation-delay:.6s}.n3{animation-delay:1.2s}.n4{animation-delay:1.8s}
    .arch{stroke-dasharray:900;animation:draw 2.2s .2s ease-out both}
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <circle cx="850" cy="170" r="230" fill="url(#glow)"/>

    <!-- Left: intro -->
    <text class="mono r1" x="56" y="70" font-size="15" fill="#38BDF8">~/tunisia $ whoami</text>
    <rect x="212" y="57" width="9" height="17" fill="#F4C95D">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <text class="sans r2" x="54" y="140" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1">Ahmed Kallel</text>
    <rect class="bar" x="56" y="156" width="130" height="4" rx="2" fill="url(#accent)"/>

    <text class="sans r3" x="56" y="199" font-size="21" fill="#bcd3e0">Software Engineer · AI &amp; Automation · Full-Stack</text>
    <text class="mono r4" x="56" y="226" font-size="14" fill="#6b8798">final-year engineering student @ FST — building from Tunisia</text>

    <g class="mono r5" font-size="13" fill="#bcd3e0" text-anchor="middle">
      <rect x="56" y="248" width="51" height="28" rx="14" fill="#38BDF8" fill-opacity=".08" stroke="#38BDF8" stroke-opacity=".5"/>
      <text x="81.5" y="267">RAG</text>
      <rect x="117" y="248" width="114" height="28" rx="14" fill="#38BDF8" fill-opacity=".08" stroke="#38BDF8" stroke-opacity=".5"/>
      <text x="174" y="267">Multi-Agent</text>
      <rect x="241" y="248" width="51" height="28" rx="14" fill="#F4C95D" fill-opacity=".08" stroke="#F4C95D" stroke-opacity=".55"/>
      <text x="266.5" y="267">n8n</text>
      <rect x="302" y="248" width="106" height="28" rx="14" fill="#38BDF8" fill-opacity=".08" stroke="#38BDF8" stroke-opacity=".5"/>
      <text x="355" y="267">Full-Stack</text>
      <rect x="418" y="248" width="106" height="28" rx="14" fill="#F4C95D" fill-opacity=".08" stroke="#F4C95D" stroke-opacity=".55"/>
      <text x="471" y="267">Algorithms</text>
    </g>

    <!-- Right: arch (a nod to Tunisian doorways) with an agent graph inside -->
    <path class="arch" d="M750 330 V150 A100 100 0 0 1 950 150 V330" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity=".75"/>
    <path d="M764 330 V150 A86 86 0 0 1 936 150 V330" fill="none" stroke="#F4C95D" stroke-width="1" stroke-opacity=".35"/>

    <g>
      <line class="edge" x1="850" y1="170" x2="808" y2="112"/>
      <line class="edge" x1="850" y1="170" x2="898" y2="120"/>
      <line class="edge" x1="850" y1="170" x2="800" y2="226"/>
      <line class="edge" x1="850" y1="170" x2="904" y2="232"/>
      <line class="edge" x1="850" y1="170" x2="850" y2="88"/>
      <line class="edge" x1="800" y1="226" x2="850" y2="274"/>
      <line class="edge" x1="904" y1="232" x2="850" y2="274"/>
      <line class="edge" x1="808" y1="112" x2="850" y2="88"/>
      <line class="edge" x1="898" y1="120" x2="850" y2="88"/>
    </g>

    <circle cx="850" cy="170" r="14" fill="none" stroke="#38BDF8" stroke-width="1.5">
      <animate attributeName="r" values="14;36" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="170" r="14" fill="url(#accent)"/>
    <text class="mono" x="850" y="199" font-size="10" fill="#bcd3e0" text-anchor="middle">RAG</text>

    <circle class="node" cx="808" cy="112" r="7" fill="#38BDF8"/>
    <circle class="node n2" cx="898" cy="120" r="7" fill="#F4C95D"/>
    <circle class="node n3" cx="800" cy="226" r="7" fill="#F4C95D"/>
    <circle class="node n4" cx="904" cy="232" r="7" fill="#38BDF8"/>
    <circle class="node n2" cx="850" cy="88" r="5" fill="#F4C95D"/>
    <circle class="node n3" cx="850" cy="274" r="7" fill="#38BDF8"/>
  </g>

  <rect x=".5" y=".5" width="999" height="319" rx="18" fill="none" stroke="#38BDF8" stroke-opacity=".22"/>
</svg>
