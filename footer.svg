<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="Code is not just syntax — it's a solution waiting to happen." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14394a"/>
      <stop offset="1" stop-color="#0a141d"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#F4C95D"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="130" rx="18"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif}
  </style>
  <g clip-path="url(#card)">
    <rect width="1000" height="130" fill="url(#bg)"/>
    <path d="M-250 34 q62.5 -24 125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0" fill="none" stroke="url(#wave)" stroke-width="2" stroke-opacity=".8">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="250 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M-250 44 q62.5 -18 125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity=".35">
      <animateTransform attributeName="transform" type="translate" from="250 0" to="0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <text class="sans" x="500" y="88" font-size="19" font-style="italic" fill="#e6f1f8" text-anchor="middle">“Code is not just syntax — it’s a solution waiting to happen.”</text>
    <text class="mono" x="500" y="112" font-size="12" fill="#6b8798" text-anchor="middle">built with curiosity, in Tunisia</text>
  </g>
  <rect x=".5" y=".5" width="999" height="129" rx="18" fill="none" stroke="#38BDF8" stroke-opacity=".22"/>
</svg>
